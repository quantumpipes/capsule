[package]
name = "quantumpipes"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tamper-evident audit records: create, seal, and verify Capsules (CPS 1.0)"
repository = "https://github.com/quantumpipes/capsule"
keywords = ["ai", "audit", "capsule", "cryptography", "ed25519"]
categories = ["cryptography", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
