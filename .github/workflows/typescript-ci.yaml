name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "reference/typescript/**"
      - "conformance/**"
      - "spec/**"
      - ".github/workflows/typescript-ci.yaml"
      - ".github/workflows/typescript-release.yaml"
  pull_request:
    branches: [main]
    paths:
      - "reference/typescript/**"
      - "conformance/**"
      - "spec/**"
      - ".github/workflows/typescript-ci.yaml"
      - ".github/workflows/typescript-release.yaml"

permissions:
  contents: read

defaults:
  run:
    working-directory: reference/typescript

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npx vitest run

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx vitest run __tests__/conformance.test.ts
