name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - "reference/rust/**"
      - "conformance/**"
      - "spec/**"
      - ".github/workflows/rust-ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "reference/rust/**"
      - "conformance/**"
      - "spec/**"
      - ".github/workflows/rust-ci.yaml"

permissions:
  contents: read

defaults:
  run:
    working-directory: reference/rust

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Pinned so a new stable lint cannot turn CI red with no code change.
      - run: rustup toolchain install 1.94.1 --profile minimal --component clippy && rustup default 1.94.1
      # Cargo.lock is committed and --locked refuses any resolution it does not record.
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
